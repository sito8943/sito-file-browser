[package]
name = "sito-file-browser"
version = "0.17.0"
# Two binaries live here (the GUI app + the `sfb` CLI). `cargo run` / `tauri dev` need to know
# which one is the default; the GUI app is it.
default-run = "sito-file-browser"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# Shared library crate: the file-operation cores live here so the GUI app and the `sfb` CLI drive
# identical logic. Both binaries below link this.
[lib]
name = "sito_file_browser_lib"
path = "src/lib.rs"

# The Tauri GUI application (must keep the package name so `tauri build`/bundling finds it).
[[bin]]
name = "sito-file-browser"
path = "src/main.rs"

# Headless resource CLI over the same filesystem cores. JSON out; discovery via api-resources/schema.
[[bin]]
name = "sfb"
path = "src/bin/sfb.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "protocol-asset"] }
tauri-plugin-window-state = "2"
tauri-plugin-opener = "2"
tauri-plugin-fs = { version = "2", features = ["watch"] }
tauri-plugin-dialog = "2"
tauri-plugin-drag = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
window-vibrancy = "0.5"
sysinfo = "0.30.5"
jwalk = "0.8.1"
# Persistent on-disk cache of recursive directory sizes (size_index.db in the app data dir). Bundled
# feature statically links SQLite so there's no system-libsqlite dependency. See index.rs.
rusqlite = { version = "0.32", features = ["bundled"] }
# Recursive filesystem watcher (FSEvents on macOS) that keeps the size index fresh in real time:
# changes bubble a delta into the cached ancestor sizes and emit dir-size-changed. See watcher.rs.
notify = "6"
markdown = "0.3.0"
trash = "5"
# Archive support (zip compress/extract). Pure-Rust — no system binary or C dependency; keeps the
# cross-platform build clean. 7z/rar are handled separately by shelling out to system binaries.
zip = { version = "2", features = ["aes-crypto"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
imageproc = { version = "0.25", default-features = false }
ab_glyph = "0.2"
arboard = "3"

# SSH/SFTP remote browsing (see SSH_PLAN.md). Pure-Rust SSH stack — no libssh2 C dependency, keeps
# the cross-platform build clean. russh is fully async; it runs on Tauri's tokio runtime.
russh = "0.64"
russh-sftp = "2"
tokio = { version = "1", features = ["rt", "sync", "macros", "fs", "io-util", "net", "time"] }
# Remote control (plans/REMOTE_CONTROL_PLAN.md): ids for authorized roots in remote.toml.
uuid = { version = "1", features = ["v4"] }
# Binary payloads (file chunks, thumbnails) inside the JSON protocol of the encrypted channel.
base64 = "0.22"
# statfs() to refuse network filesystems as remote roots (remote/volume.rs). Already in the tree.
libc = "0.2"
# HTTPS to sito-auth (sign-in, token refresh, /devices). Already in the tree through tauri; the
# default features add rustls (its aws-lc-rs provider is already built for russh).
reqwest = { version = "0.13", features = ["json"] }
# Outbound WSS to sito-remote-relay (remote/relay_client.rs). rustls with the aws-lc-rs provider
# (already built for russh), installed explicitly at service start so the TLS backend never depends
# on which crypto features other crates happen to enable.
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# End-to-end crypto of the remote channel (remote/crypto.rs): P-256 ECDH, HKDF-SHA256, AES-256-GCM.
# Same primitives as the Android side (JCA). Already built for russh/rustls, so no new C build.
aws-lc-rs = "1"
# Wipe handshake key material (concatenated ECDH secrets) from memory after use.
zeroize = "1"

# Finder tags live in a macOS extended attribute (a binary plist) — only needed there.
# objc2 crates drive the custom Dock right-click menu (recent folders + quick actions).
[target.'cfg(target_os = "macos")'.dependencies]
# OS keychain for SSH connection secrets (passwords / key passphrases) — see SSH_PLAN.md phase 2.
# apple-native = the macOS Keychain backend. Keychain code in filesystem/sftp.rs is cfg-gated so
# non-macOS builds fall back to plaintext toml / env (no keyring dependency there).
keyring = { version = "3", features = ["apple-native"] }
xattr = "1"
plist = "1"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSArray"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSMenu", "NSMenuItem", "NSResponder", "NSRunningApplication", "NSPasteboard", "NSPasteboardItem", "NSWorkspace", "NSImage"] }

# OS credential store on Windows/Linux for the remote-control secrets (device private key, sito-auth
# refresh token). SFTP secrets stay macOS-only (filesystem/sftp.rs is still cfg-gated); remote
# control runs on all three desktop platforms (plans/REMOTE_CONTROL_PLAN.md, decision 1).
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
# GetDriveTypeW: refuse mapped network drives as remote roots (remote/volume.rs).
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

# Secret Service (GNOME Keyring / KWallet) over D-Bus. `crypto-rust` avoids an OpenSSL dependency
# and `vendored` builds libdbus so CI/dev machines don't need libdbus-1-dev installed.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust", "vendored"] }

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
